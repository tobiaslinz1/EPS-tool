<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>EPS Projektion</title>
<style>
:root{
  --bg:#f2f2f7; --panel:#ffffff; --text:#1d1d1f; --text2:#6e6e73; --text3:#aeaeb2;
  --line:rgba(60,60,67,.12); --line2:rgba(60,60,67,.22);
  --fill:rgba(118,118,128,.10); --fill2:rgba(118,118,128,.18);
  --accent:#007aff; --accent-soft:rgba(0,122,255,.12);
  --red:#ff3b30; --green:#34c759; --orange:#ff9500; --pink:#ff2d55; --cyan:#32ade6;
  --stage:#2c2c2e;
  --rs:9px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--text);overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-font-smoothing:antialiased;font-size:14px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
textarea,input[type=text],input[type=number]{user-select:text;-webkit-user-select:text}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-rows:auto 1fr;height:100vh}
.top{display:flex;align-items:center;gap:10px;padding:10px 16px;background:rgba(255,255,255,.88);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line);z-index:5;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:8px}
.logo{width:32px;height:32px;border-radius:8px;background:var(--stage);display:grid;place-items:center}
.brand b{font-size:15px;font-weight:600;letter-spacing:-.2px;display:block}
.brand small{display:block;font-size:11px;color:var(--text2)}
.spacer{flex:1}

.seg{display:inline-flex;background:var(--fill);border-radius:9px;padding:2px;gap:2px;flex-wrap:nowrap}
.seg button{padding:6px 12px;border-radius:7px;font-size:13px;font-weight:500;white-space:nowrap;min-height:32px}
.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.14)}
.seg.full{display:flex;width:100%}
.seg.full button{flex:1}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:var(--rs);background:var(--fill);font-size:13.5px;font-weight:500;min-height:36px;transition:background .15s,transform .1s;white-space:nowrap}
.btn:hover{background:var(--fill2)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{background:#0a6fe0}
.btn.danger{color:var(--red);background:rgba(255,59,48,.10)}
.btn.on{background:var(--accent-soft);color:var(--accent)}
.btn.sm{min-height:32px;padding:5px 10px;font-size:12.5px}
.btn.block{width:100%}
.btn:disabled{opacity:.35;pointer-events:none}
.btn .ico{font-size:15px;line-height:1}

.main{display:grid;grid-template-columns:minmax(0,1fr) 340px;min-height:0}
.side,.insp{background:var(--panel);display:flex;flex-direction:column;min-height:0}
.side{border-right:1px solid var(--line)}
.insp{border-left:1px solid var(--line)}
.scroll{flex:1;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch}
.sec{margin-bottom:22px}
.sec>h3{font-size:13px;font-weight:600;color:var(--text2);margin-bottom:10px}
.foot{padding:12px 16px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:8px}

.addgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.add{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:12px;background:var(--fill);font-size:12px;font-weight:500;transition:background .15s}
.add:hover{background:var(--fill2)}
.add svg{width:24px;height:24px}

.list{display:flex;flex-direction:column;gap:2px}
.item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:11px;cursor:pointer;border:1px solid var(--line);background:#fff;margin-bottom:6px;box-shadow:0 1px 2px rgba(0,0,0,.025)}
.item:hover{background:var(--fill)}
.item.on{background:var(--accent-soft);border-color:rgba(0,122,255,.28);box-shadow:0 0 0 1px rgba(0,122,255,.06)}
.item .ic{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;background:var(--stage);flex-shrink:0;overflow:hidden}
.item .ic svg{width:18px;height:18px}
.item .ic img{width:100%;height:100%;object-fit:contain}
.item .tx{min-width:0;flex:1}
.item .nm{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .sub{font-size:11.5px;color:var(--text2);font-variant-numeric:tabular-nums}
.empty{padding:22px 8px;text-align:center;color:var(--text2);font-size:13px;line-height:1.5}

.center{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0}
.canvas{flex:1;display:flex;overflow:auto;padding:44px 28px 28px 108px;min-height:0}
.plate-wrap{position:relative;margin:auto;border-radius:3px;box-shadow:0 18px 50px rgba(0,0,0,.20),0 2px 6px rgba(0,0,0,.10)}
.plate-wrap svg{display:block;touch-action:none;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
.plate-tag{position:absolute;top:-26px;left:0;font-size:12.5px;color:var(--text2);font-weight:500;white-space:nowrap}
.dock{display:flex;align-items:center;gap:6px;padding:10px 14px;background:rgba(255,255,255,.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line);flex-wrap:wrap}
.dock .sep{width:1px;height:22px;background:var(--line2);margin:0 4px}
.zoomv{font-size:12.5px;font-weight:600;min-width:44px;text-align:center;font-variant-numeric:tabular-nums}
.coords{font-size:12.5px;color:var(--text2);font-variant-numeric:tabular-nums;margin-left:auto}

.insp-tabs{padding:12px 16px;border-bottom:1px solid var(--line)}
.pad{display:grid;grid-template-columns:repeat(3,54px);gap:6px}
.pad button{height:54px;border-radius:12px;background:var(--fill);font-size:21px;transition:background .15s,transform .08s}
.pad button:hover{background:var(--fill2)}
.pad button:active{transform:scale(.94);background:var(--accent-soft)}
.pad .rotb{color:var(--accent)}
.row{display:flex;align-items:center;gap:8px}
.stack{display:flex;flex-direction:column;gap:8px}
.lab{font-size:12.5px;color:var(--text2);font-weight:500;margin-bottom:6px;display:flex;justify-content:space-between;align-items:baseline}
.lab b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.slider{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.slider>button{width:40px;height:40px;border-radius:10px;background:var(--fill);font-size:19px;flex-shrink:0}
.slider>button:active{background:var(--accent-soft)}
input[type=range]{flex:1;accent-color:var(--accent);height:30px;min-width:0}
.inp{width:100%;background:var(--fill);border:1px solid transparent;border-radius:var(--rs);padding:8px 10px;font-size:14px;outline:none;min-height:38px}
.inp:focus{background:#fff;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.inp.num{width:84px;text-align:right;font-variant-numeric:tabular-nums}
select.inp{padding-right:6px}
textarea.inp{resize:vertical;min-height:90px;line-height:1.45}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.align{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.align button{height:40px;border-radius:9px;background:var(--fill);font-size:15px}
.align button:hover{background:var(--fill2)}
.align button.hi{color:var(--accent);background:var(--accent-soft)}
.swatches{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line2)}
.sw.on{box-shadow:0 0 0 2.5px var(--accent)}
input[type=color].sw{padding:0;overflow:hidden;cursor:pointer;-webkit-appearance:none;appearance:none}
input[type=color].sw::-webkit-color-swatch-wrapper{padding:0}
input[type=color].sw::-webkit-color-swatch{border:none;border-radius:50%}
.hint{font-size:12.5px;color:var(--text2);line-height:1.5}
.edges{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:8px}
.edges div{background:var(--fill);border-radius:8px;padding:6px 4px;text-align:center;font-size:11px;color:var(--text2)}
.edges b{display:block;font-size:13px;color:var(--text);font-variant-numeric:tabular-nums}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:20px;background:var(--fill);color:var(--text2)}
.badge.ok{background:rgba(52,199,89,.14);color:#248a3d}

.pop{position:absolute;bottom:62px;left:14px;background:#fff;border-radius:14px;box-shadow:0 14px 44px rgba(0,0,0,.22);width:320px;padding:14px;display:none;z-index:20}
.pop.open{display:block}
.pop h4{font-size:14px;font-weight:600;margin-bottom:10px}
.tpl{display:flex;align-items:center;gap:6px;padding:6px 4px;border-radius:9px}
.tpl:hover{background:var(--fill)}
.tpl span{flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tpl button{padding:5px 7px;border-radius:7px;font-size:13px}
.tpl button:hover{background:var(--fill2)}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.28);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;z-index:50;align-items:center;justify-content:center;padding:20px}
.modal.open{display:flex}
.sheet{background:var(--bg);border-radius:18px;width:min(960px,100%);max-height:100%;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.28);overflow:hidden}
.sheet-h{display:flex;align-items:center;gap:12px;padding:14px 18px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap}
.sheet-h h2{font-size:17px;font-weight:600;flex:1}
.sheet-b{overflow-y:auto;padding:18px;flex:1}
.sheet-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;background:#fff;border-top:1px solid var(--line)}
.card{background:#fff;border-radius:14px;padding:16px 18px;margin-bottom:14px}
.card h4{font-size:15px;font-weight:600;margin-bottom:4px}
.card>.hint{margin-bottom:14px}
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.f label{display:block;font-size:12px;color:var(--text2);font-weight:500;margin-bottom:5px}
.chk{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:500;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--accent)}
.rt{width:100%;border-collapse:collapse}
.rt th{font-size:11.5px;color:var(--text2);font-weight:500;text-align:left;padding:4px}
.rt td{padding:3px 4px}
.rt .inp{min-height:34px;padding:5px 7px;font-size:13px}
.rt input[type=color]{width:34px;height:34px;border:none;background:none;padding:0}
.calgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px;align-items:start}
.mini{background:#000;border-radius:10px;width:100%;display:block;touch-action:none}
.corners{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:150px}
.corners button{height:44px;border-radius:10px;background:var(--fill);font-size:18px}
.corners button.on{background:var(--orange);color:#fff}
.corners .all{grid-column:1/3;font-size:13px;font-weight:500}
.kv{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border:0}
.kv b{font-variant-numeric:tabular-nums}

.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(30px);background:rgba(29,29,31,.92);color:#fff;padding:11px 20px;border-radius:100px;font-size:13.5px;font-weight:500;opacity:0;transition:all .25s;z-index:99;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:1100px){
  .main{grid-template-columns:minmax(0,1fr) 300px}
  .calgrid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}


.iconbtn{min-width:38px;height:36px;padding:0 8px;border-radius:9px;display:inline-grid;place-items:center;background:var(--fill);font-size:16px;transition:background .15s}
.iconbtn:hover{background:var(--fill2)}
.iconbtn:disabled{opacity:.3;pointer-events:none}
.fab{position:absolute;top:16px;left:16px;z-index:6;height:46px;padding:0 20px 0 14px;border-radius:23px;background:#fff;box-shadow:0 4px 18px rgba(0,0,0,.14),0 0 0 1px var(--line);display:flex;align-items:center;gap:8px;font-weight:600;font-size:14.5px}
.fab span{font-size:24px;color:var(--accent);line-height:1;font-weight:400}
.fab:active{transform:scale(.97)}
.pop.add{top:70px;left:16px;bottom:auto;width:310px}
.pop.guides{left:110px;width:290px}
#tplPop,#tplSavePop{left:14px}
.pop.more{position:fixed;top:60px;right:16px;left:auto;bottom:auto;width:260px;padding:6px}
.menu button{display:flex;width:100%;align-items:center;gap:10px;padding:11px 12px;border-radius:9px;font-size:14px;text-align:left}
.menu button:hover{background:var(--fill)}
.menu button.danger{color:var(--red)}
.menu hr,.pop hr{border:0;border-top:1px solid var(--line);margin:5px 8px}
.sw-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 4px;font-size:14px;font-weight:500;cursor:pointer;border-radius:9px}
.sw-row:hover{background:var(--fill)}
.sw-row small{display:block;font-size:12px;color:var(--text2);font-weight:400}
.toggle{position:relative;width:46px;height:28px;border-radius:14px;background:var(--fill2);transition:background .2s;flex-shrink:0;pointer-events:none}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.toggle.on{background:var(--green)}
.toggle.on::after{transform:translateX(18px)}
details.grp{border-top:1px solid var(--line)}
details.grp>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:14px 0;font-size:14.5px;font-weight:600}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary small{font-weight:500;color:var(--text2);font-size:12.5px;margin-left:auto;font-variant-numeric:tabular-nums}
details.grp>summary::after{content:'';width:7px;height:7px;border-right:2px solid var(--text3);border-bottom:2px solid var(--text3);transform:rotate(-45deg);margin-left:6px;transition:transform .2s}
details.grp[open]>summary::after{transform:rotate(45deg)}
details.grp>.gb{padding-bottom:16px}
.steps{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.steps button{height:40px;border-radius:9px;background:var(--fill);font-size:12.5px;font-weight:500}
.steps button.on{background:var(--accent);color:#fff}
.actions{display:grid;gap:6px;margin-top:18px}
.actions button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px;border-radius:10px;background:var(--fill);font-size:11px;font-weight:500}
.actions button b{font-size:16px;font-weight:500;line-height:1.2}
.actions button:hover{background:var(--fill2)}
.actions button.on{background:var(--accent-soft);color:var(--accent)}
.actions button.danger{color:var(--red);background:rgba(255,59,48,.08)}
.head{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.back{font-size:13.5px;color:var(--accent);font-weight:500;padding:4px 0}
.name{font-size:18px;font-weight:600;border:0;background:transparent;padding:3px 0;width:100%;outline:none;border-bottom:1px solid transparent;letter-spacing:-.2px}
.name:focus{border-bottom-color:var(--accent)}
.sub2{font-size:12.5px;color:var(--text2);margin-top:2px}


.rail{position:absolute;top:16px;left:16px;z-index:6;display:flex;flex-direction:column;gap:2px;padding:6px;background:#fff;border-radius:16px;box-shadow:0 4px 18px rgba(0,0,0,.10),0 0 0 1px var(--line);max-height:calc(100% - 100px);overflow-y:auto}
.rail button{width:60px;padding:9px 0 7px;border-radius:11px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;font-weight:500;color:var(--text2);transition:background .15s}
.rail button:hover{background:var(--fill)}
.rail button:active{background:var(--accent-soft);transform:scale(.96)}
.rail svg{width:26px;height:26px}
.rail hr{border:0;border-top:1px solid var(--line);margin:3px 8px}
.iconbtn svg{width:20px;height:20px}
.iconbtn.on{background:var(--accent-soft);color:var(--accent)}
.iconbtn{position:relative}
.cnt{position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;border-radius:9px;background:var(--accent);color:#fff;font-size:10.5px;font-weight:600;display:grid;place-items:center;padding:0 4px}
/* Beamer-Ausgabe */
body.beamer{background:#000;cursor:none}
.bstage{position:fixed;inset:0;overflow:hidden}
.bplate{position:absolute;left:0;top:0;transform-origin:0 0}
.bplate svg{display:block;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
.bover{position:fixed;left:0;top:0;pointer-events:none;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
.bhint{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);padding:24px 32px;border-radius:16px;text-align:center;transition:opacity .6s;cursor:default;line-height:1.6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
.bhint h2{font-size:18px;font-weight:600;margin-bottom:6px}
.bhint p{font-size:13px;opacity:.65}
.bhint.hide{opacity:0;pointer-events:none}
</style>
</head>
<body>

<div class="app" id="app">
  <header class="top" id="top"></header>
  <div class="main">
    <section class="center">
      <div class="rail" id="rail" aria-label="Objekte hinzufügen"></div>
      <div class="canvas" id="canvas"><div class="plate-wrap" id="plateWrap"></div></div>
      <div class="dock" id="dock"></div>
      <div class="pop" id="tplPop"></div>
      <div class="pop" id="tplSavePop"></div>
      <div class="pop guides" id="guidesPop"></div><div class="pop guides" id="hspPop"></div><div class="pop guides" id="platePop"></div><div class="pop guides" id="sizesPop"></div>
    </section>
    <aside class="insp"><div class="scroll" id="insp"></div></aside>
  </div>
</div>
<div class="pop more menu" id="morePop"></div>

<div class="modal" id="settings">
  <div class="sheet">
    <div class="sheet-h"><h2>Einstellungen</h2><button class="btn primary" data-act="closeSettings">Fertig</button></div>
    <div class="sheet-b" id="settingsBody"></div>
  </div>
</div>

<div class="modal" id="calib">
  <div class="sheet">
    <div class="sheet-h" id="calibHead"></div>
    <div class="sheet-b" id="calibBody"></div>
    <div class="sheet-f" id="calibFoot"></div>
  </div>
</div>

<input type="file" id="fImg" accept="image/png,image/jpeg,image/webp,image/svg+xml" hidden>
<input type="file" id="fProj" accept=".epst,.json,application/json" hidden>
<input type="file" id="fSetup" accept=".json,application/json" hidden>
<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';

/* ================= Grundlagen ================= */
const IS_BEAMER = location.hash === '#beamer';
const $ = s => document.querySelector(s);
const clone = o => JSON.parse(JSON.stringify(o));
const r1 = v => Math.round(v * 10) / 10;
const r2 = v => Math.round(v * 100) / 100;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmt = v => (Math.round(v * 10) / 10).toLocaleString('de-DE', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
};
function deepMerge(a, b) {
  if (Array.isArray(a)) return Array.isArray(b) ? b : a;
  if (a && typeof a === 'object') {
    const o = Object.assign({}, a);
    if (b && typeof b === 'object') for (const k in b) o[k] = (k in a) ? deepMerge(a[k], b[k]) : b[k];
    return o;
  }
  return b === undefined ? a : b;
}
function setDeep(obj, path, v) {

    s+='<text x="'+(x+.5)+'" y="'+Math.max(1.2,y/2)+'" fill="'+c+'" font-size="'+fs+'" font-weight="700">Y '+fmt(y)+' cm</text>';
    s+='<circle cx="'+x+'" cy="'+y+'" r="'+(3*px)+'" fill="'+c+'"/>';
    s+='</g>';
  }
  return s;
}

function selectionSVG(pl, sel, px) {
  let s = '';
  const single = sel.length === 1;
  for (const key of sel) {
    if (key[0] !== 's') continue;
    const o = pl.shapes.find(v => v.id === +key.slice(1)); if (!o) continue;
    const pad = 4 * px, x0 = o.x - o.w / 2 - pad, y0 = o.y - o.h / 2 - pad, W = o.w + 2 * pad, H = o.h + 2 * pad;
    s += '<g transform="rotate(' + (o.rot || 0) + ' ' + o.x + ' ' + o.y + ')">';
    s += '<rect x="' + x0 + '" y="' + y0 + '" width="' + W + '" height="' + H + '" fill="none" stroke="' + ACCENT + '" stroke-width="' + (1.5 * px) + '" stroke-dasharray="' + (5 * px) + ' ' + (3 * px) + '"/>';
    const cl = 7 * px;
    s += '<line x1="' + (o.x - cl) + '" y1="' + o.y + '" x2="' + (o.x + cl) + '" y2="' + o.y + '" stroke="' + ACCENT + '" stroke-width="' + (1.5 * px) + '"/><line x1="' + o.x + '" y1="' + (o.y - cl) + '" x2="' + o.x + '" y2="' + (o.y + cl) + '" stroke="' + ACCENT + '" stroke-width="' + (1.5 * px) + '"/>';
    if (single && !o.locked) {
      const hr = 8 * px;
      const hs = [['nw', x0, y0], ['ne', x0 + W, y0], ['se', x0 + W, y0 + H], ['sw', x0, y0 + H]];
      for (const [n, hx, hy] of hs) s += '<circle data-k="h" data-h="' + n + '" data-id="' + o.id + '" cx="' + hx + '" cy="' + hy + '" r="' + hr + '" fill="#fff" stroke="' + ACCENT + '" stroke-width="' + (2 * px) + '"/>';
    }
    s += '</g>';
    if (single) {
      const bb = rotBBox(o);
      s += '<text x="' + o.x + '" y="' + (o.y + bb.h / 2 + 18 * px) + '" font-size="' + (11.5 * px) + '" text-anchor="middle" fill="#fff" font-weight="600">' + fmt(o.w) + ' × ' + fmt(o.h) + ' cm' + (o.locked ? '  ·  gesperrt' : '') + '</text>';
    }
  }
  return s;
}

function plateSVG(pl, su, view, pid, K, o) {
  o = o || {};
  const P = su.plates[pid], w = P.w, h = P.h, px = 1 / K, ed = !!o.editor, sel = o.sel || [];
  let s = '<svg xmlns="http://www.w3.org/2000/svg" width="' + (w * K) + '" height="' + (h * K) + '" viewBox="0 0 ' + w + ' ' + h + '" style="overflow:visible">';
  if (ed) s += '<rect x="0" y="0" width="' + w + '" height="' + h + '" fill="#2c2c2e" data-bg="1"/>';
  else if (su.plateFill === 'light') s += '<rect x="0" y="0" width="' + w + '" height="' + h + '" fill="#ffffff"/>';
  if (view.grid) s += gridSVG(w, h, su, px, ed, view.measures);
  if (view.ruler) s += rulerSVG(w, h, su, px);
  if (view.hsp) s += hspSVG(w, h, su, px);
  if (view.cross) s += crossSVG(w, h, su, px);
  if (view.outerGuides) s += outerGuidesSVG(w,h,su,px);
  if (pl.info && pl.info.text) s += infoSVG(pl.info, w, h);
  for (const sh of pl.shapes) s += shapeSVG(sh, px, ed);
  if (view.infoDims) s += infoDimsSVG(pl,w,h,px);
  for (const ln of pl.lines) s += lineSVG(ln, w, h, px, ed, sel.includes('l' + ln.id), view, (su.outerGuides||{}).extend);
  if (ed || su.outline) {
    const oc = ed ? 'rgba(255,255,255,.22)' : (su.plateFill === 'light' ? 'rgba(0,0,0,.5)' : 'rgba(255,255,255,.5)');
    s += '<rect x="' + (px / 2) + '" y="' + (px / 2) + '" width="' + (w - px) + '" height="' + (h - px) + '" fill="none" stroke="' + oc + '" stroke-width="' + px + '" pointer-events="none"/>';
  }
  if (ed) s += selectionSVG(pl, sel, px);
  return s + '</svg>';
}

if (IS_BEAMER) { initBeamer(); return; }

function initBeamer() {
  document.title = 'EPS – Beamer';
  document.body.className = 'beamer';
  document.body.innerHTML = '<div class="bstage" id="bstage"></div><div class="bhint" id="bhint"><h2>Beamer-Ausgabe</h2><p>Fenster auf den Beamer-Bildschirm ziehen,<br>dann doppelklicken oder F11 für Vollbild.</p><p id="bstat" style="margin-top:10px">Warte auf das Steuerfenster …</p></div>';
  let B = null, bc = null, hideT = null;
  const stage = document.getElementById('bstage');
  try { bc = new BroadcastChannel('eps5'); } catch (e) { bc = null; }
  function report() {
    const d = { w: window.innerWidth, h: window.innerHeight };
    LS.set('eps5-beamer-size', d);
    if (bc) try { bc.postMessage(Object.assign({ type: 'size' }, d)); } catch (e) {}
  }
  function apply(d) {
    if (!d || !d.setup) return;
    if (B && d.ts && B.ts && d.ts < B.ts) return;
    B = d; render();
    const hint = document.getElementById('bhint');
    if (hint && !hint.classList.contains('hide') && !hideT) {
      document.getElementById('bstat').textContent = 'Verbunden';
      hideT = setTimeout(() => hint.classList.add('hide'), 2500);
    }
  }
  function render() {
    if (!B) return;
    const su = deepMerge(DEFAULT_SETUP, B.setup), W = window.innerWidth, H = window.innerHeight, c = B.calib || {};
    const view = deepMerge(DEFAULT_VIEW, B.view || {}), layout = normLayout(B.layout);
    document.body.style.background = su.bg;
    stage.style.background = su.bg;
    let html = '';
    const pids = platesOf(su);
    if (!(c.active && c.step === 1)) {
      for (const pid of pids) {
        const cs = cornersOf(su, pid).map(p => ({ x: p.x * W, y: p.y * H }));
        const P = su.plates[pid];
        const K = Math.max(0.5, Math.hypot(cs[1].x - cs[0].x, cs[1].y - cs[0].y) / P.w);
        const w = P.w * K, h = P.h * K;
        const m = homography([{ x: 0, y: 0 }, { x: w, y: 0 }, { x: w, y: h }, { x: 0, y: h }], cs);
        const inner = c.active ? calibPlateSVG(su, pid, K, c) : plateSVG(layout.plates[pid], su, view, pid, K, {});
        html += '<div class="bplate" style="width:' + w + 'px;height:' + h + 'px;transform:' + m + '">' + inner + '</div>';
      }
    }
    if (c.active) html += calibOverlaySVG(su, c, W, H, pids);
    stage.innerHTML = html;
  }
  if (bc) bc.onmessage = e => { const m = e.data || {}; if (m.type === 'state') apply(m); };
  window.addEventListener('storage', e => { if (e.key === 'eps5-live') apply(LS.get('eps5-live', null)); });
  setInterval(() => { const d = LS.get('eps5-live', null); if (d && (!B || (d.ts || 0) > (B.ts || 0))) apply(d); }, 800);
  window.addEventListener('resize', () => { report(); render(); });
  document.addEventListener('dblclick', () => {
    if (document.fullscreenElement) document.exitFullscreen && document.exitFullscreen();
    else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
  });
  report();
  if (bc) try { bc.postMessage({ type: 'hello' }); } catch (e) {}
  apply(LS.get('eps5-live', null));
}

function calibPlateSVG(su, pid, K, c) {
  const P = su.plates[pid], w = P.w, h = P.h, px = 1 / K;
  let s = '<svg xmlns="http://www.w3.org/2000/svg" width="' + (w * K) + '" height="' + (h * K) + '" viewBox="0 0 ' + w + ' ' + h + '" style="overflow:visible">';
  s += '<rect x="0" y="0" width="' + w + '" height="' + h + '" fill="none" stroke="#fff" stroke-width="' + (2 * px) + '"/>';
  if (c.step === 4) {
    const q = Math.max(1, +c.sq || 10), x = w / 2 - q / 2, y = h / 2 - q / 2;
    s += '<line x1="0" y1="' + (h / 2) + '" x2="' + w + '" y2="' + (h / 2) + '" stroke="rgba(255,255,255,.35)" stroke-width="' + px + '"/>';
    s += '<line x1="' + (w / 2) + '" y1="0" x2="' + (w / 2) + '" y2="' + h + '" stroke="rgba(255,255,255,.35)" stroke-width="' + px + '"/>';
    s += '<rect x="' + x + '" y="' + y + '" width="' + q + '" height="' + q + '" fill="none" stroke="#ff9f0a" stroke-width="' + (2 * px) + '"/>';
    s += '<text x="' + (w / 2) + '" y="' + (y + q + 2) + '" fill="#ff9f0a" font-size="1.4" text-anchor="middle" font-weight="600">' + q + ' × ' + q + ' cm</text>';
  } else {
    let d = '';
    for (let x = 5; x < w - 1e-6; x += 5) d += 'M' + x + ' 0V' + h;
    for (let y = 5; y < h - 1e-6; y += 5) d += 'M0 ' + y + 'H' + w;
    s += '<path d="' + d + '" stroke="rgba(255,255,255,.3)" stroke-width="' + px + '" fill="none"/>';
    s += '<text x="' + (w / 2) + '" y="' + (h / 2) + '" fill="rgba(255,255,255,.7)" font-size="3" text-anchor="middle" dominant-baseline="middle" font-weight="700">' + (pid === 'L' ? 'Links' : 'Rechts') + '</text>';
    s += '<text x="' + (w / 2) + '" y="' + (h / 2 + 3) + '" fill="rgba(255,255,255,.5)" font-size="1.6" text-anchor="middle" font-weight="500">' + w + ' × ' + h + ' cm</text>';
  }
  return s + '</svg>';
}

function calibOverlaySVG(su, c, W, H, pids) {
  let s = '<svg class="bover" width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '">';
  if (c.step === 1) {
    const G=su.calibration||{}, sc=clamp(+G.gridScale||.78,.2,1), gw=W*sc, gh=H*sc, cx=W/2+(+G.gridX||0), cy=H/2+(+G.gridY||0), x0=cx-gw/2,y0=cy-gh/2, st=Math.max(25,+G.gridStep||50);
    s += '<rect x="'+x0+'" y="'+y0+'" width="'+gw+'" height="'+gh+'" fill="none" stroke="#fff" stroke-width="3"/>';
    let gd=''; for(let x=cx;x<x0+gw;x+=st)gd+='M'+x+' '+y0+'V'+(y0+gh);for(let x=cx-st;x>x0;x-=st)gd+='M'+x+' '+y0+'V'+(y0+gh);for(let y=cy;y<y0+gh;y+=st)gd+='M'+x0+' '+y+'H'+(x0+gw);for(let y=cy-st;y>y0;y-=st)gd+='M'+x0+' '+y+'H'+(x0+gw);
    s += '<path d="'+gd+'" stroke="rgba(255,255,255,.28)" stroke-width="1"/><line x1="'+x0+'" y1="'+cy+'" x2="'+(x0+gw)+'" y2="'+cy+'" stroke="#ff2d55" stroke-width="2"/><line x1="'+cx+'" y1="'+y0+'" x2="'+cx+'" y2="'+(y0+gh)+'" stroke="#64d2ff" stroke-width="2"/>';
    s += '<circle cx="'+cx+'" cy="'+cy+'" r="8" fill="none" stroke="#ffd60a" stroke-width="2"/><text x="'+cx+'" y="'+(y0+gh+28)+'" fill="#fff" font-size="18" text-anchor="middle" font-weight="600">Montageraster · Beamer mechanisch gerade ausrichten</text>';
  } else if (c.step === 2 || c.step === 3) {
    for (const pid of pids) {
      const cs = cornersOf(su, pid).map(p => ({ x: p.x * W, y: p.y * H }));
      if(c.step===2){
        const col=pid===c.plate?'#ff9f0a':'rgba(255,255,255,.45)', cen={x:cs.reduce((a,p)=>a+p.x,0)/4,y:cs.reduce((a,p)=>a+p.y,0)/4};
        s+='<polygon points="'+cs.map(p=>p.x+','+p.y).join(' ')+'" fill="'+(pid===c.plate?'rgba(255,159,10,.08)':'none')+'" stroke="'+col+'" stroke-width="'+(pid===c.plate?5:2)+'"/>';
        s+='<line x1="'+(cen.x-35)+'" y1="'+cen.y+'" x2="'+(cen.x+35)+'" y2="'+cen.y+'" stroke="'+col+'" stroke-width="3"/><line x1="'+cen.x+'" y1="'+(cen.y-35)+'" x2="'+cen.x+'" y2="'+(cen.y+35)+'" stroke="'+col+'" stroke-width="3"/><circle cx="'+cen.x+'" cy="'+cen.y+'" r="9" fill="none" stroke="'+col+'" stroke-width="3"/>';
        s+='<text x="'+cen.x+'" y="'+(cen.y+58)+'" fill="'+col+'" font-size="20" text-anchor="middle" font-weight="700">PLATTE '+pid+' · '+su.plates[pid].w+' × '+su.plates[pid].h+' cm</text>';
      }
      cs.forEach((p, i) => {
        if(c.step===2 && pid!==c.plate) return;
        const act = c.step === 3 && c.plate === pid && (c.corner === i || c.corner === 4);
        s += '<circle cx="' + p.x + '" cy="' + p.y + '" r="' + (act ? 14 : 9) + '" fill="' + (act ? '#ff9f0a' : 'none') + '" stroke="' + (act ? '#ff9f0a' : '#fff') + '" stroke-width="2"/>';
        s += '<line x1="' + (p.x - 22) + '" y1="' + p.y + '" x2="' + (p.x + 22) + '" y2="' + p.y + '" stroke="' + (act ? '#ff9f0a' : '#fff') + '" stroke-width="1"/><line x1="' + p.x + '" y1="' + (p.y - 22) + '" x2="' + p.x + '" y2="' + (p.y + 22) + '" stroke="' + (act ? '#ff9f0a' : '#fff') + '" stroke-width="1"/>';
      });
    }
  }
  return s + '</svg>';
}

function livePayload() { return { type: 'state', setup, layout: S.layout, view: S.view, calib: S.calib, ts: Date.now() }; }

function persist() {
  if (!LS.set('eps5-layout', S.layout) && !S.warned) { S.warned = true; toast('Browser-Speicher voll – große Bilder bitte als Projekt speichern'); }
  LS.set('eps5-view', S.view);
  syncLive(true);
}

function commit() {
  const snap = JSON.stringify(S.layout);
  if (S.history[S.hi] !== snap) {
    S.history = S.history.slice(0, S.hi + 1);
    S.history.push(snap);
    if (S.history.length > 50) S.history.shift();
    S.hi = S.history.length - 1;
  }
  persist();
  renderTop();
}
function restore(i) {
  S.hi = i; S.layout = JSON.parse(S.history[i]); S.sel = [];

}

function listHTML() {

function inspShape(o) {

function inspMulti(sel) {

    });
    saveSetup(); syncLive(true); renderCalib();
    toast('Maßstab korrigiert – bitte das Quadrat erneut messen');
  }
};

Object.assign(ACT, {
  resetPlateOffset(){ const p=dims(); p.offsetX=0;p.offsetY=0;p.offsetRot=0;p.corners=null;saveSetup();renderAll();renderPlatePop();toast('Platten-Offset zurückgesetzt'); },
  radial(a){ const [out,dy]=a.split(',').map(Number), d=dims(), cx=d.w/2, st=S.step; let any=false; for(const s of selObjs()){if(s.k!=='s'||s.o.locked)continue;if(out){const side=s.o.x<cx?-1:s.o.x>cx?1:0;s.o.x=r2(s.o.x+side*out*st);}if(dy)s.o.y=r2(s.o.y+dy*st);any=true;}if(any){commit();renderCanvas();renderInsp();} },
  sizeSave(){const z=S.layout.sizeProfiles, size=($('#sizeSaveSel')||{}).value;if(!size)return;z.saved=z.saved||{L:{},R:{}};z.saved[S.plate][size]=clone(P());z.enabled=true;z.active=size;commit();renderTop();renderSizesPop();toast('Platte als '+size+' gespeichert');},
  sizeLoad(size){const z=S.layout.sizeProfiles, snap=z.saved&&z.saved[S.plate]&&z.saved[S.plate][size];if(!snap)return toast('Für '+size+' ist auf dieser Platte noch nichts gespeichert');S.layout.plates[S.plate]=clone(snap);z.enabled=true;z.active=size;S.sel=[];commit();renderAll();renderSizesPop();toast('Größe '+size+' geladen');},
  sizeDelete(size){const z=S.layout.sizeProfiles;if(z.saved&&z.saved[S.plate])delete z.saved[S.plate][size];if(z.active===size)z.active='';const any=['L','R'].some(p=>z.saved&&z.saved[p]&&Object.keys(z.saved[p]).length);z.enabled=any;commit();renderTop();renderSizesPop();toast('Größenstand '+size+' gelöscht');},
  pop(id) {
    const el = $('#' + id); if (!el) return;
    const open = !el.classList.contains('open');

    if (open) { ({ addPop: renderAddPop, morePop: renderMore, guidesPop: renderGuides, hspPop: renderHspPop, platePop: renderPlatePop, sizesPop: renderSizesPop, tplPop: renderTplPop, tplSavePop: renderTplSave }[id] || (() => {}))(); el.classList.add('open'); }
  },
  view(k) {
    S.view[k] = !S.view[k];
    if (k === 'lockLines') toast(S.view.lockLines ? 'Alle Linien gesperrt' : 'Linien wieder beweglich');
    if (k === 'snap') toast(S.view.snap ? 'Magnet an: rastet auf 0,5 cm ein' : 'Magnet aus');
    persist(); renderDock(); renderCanvas();
    if ($('#guidesPop').classList.contains('open')) renderGuides();
  }
});

function materialize(pid) {
  const P0 = setup.plates[pid];
  if (!P0.corners) P0.corners = clone(roughCorners(setup, pid));
  return P0.corners;
}
function normalizePlates() {
  const L = setup.plates.L, R = setup.plates.R;
  R.x = r2((+L.x || 0) + (+L.w || 0) + (+setup.gap || 0));
}
function download(name, obj, mime) {
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type: mime || 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

    '<button class="btn" data-act="openBeamer">Beamer öffnen</button><span class="spacer"></span>' +
    (st < 4 ? '<button class="btn primary" data-act="calStep" data-arg="' + (st + 1) + '">Weiter</button>' : '') +
    '<button class="btn ' + (st === 4 ? 'primary' : '') + '" data-act="closeCalib">Fertig</button>';
  if (st === 3) drawMini();
}
function drawMini() {
  const svg = $('#mini'); if (!svg) return;
  const bs = S.beamerSize, W = bs.w, H = bs.h, c = S.calib;
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  const r = Math.max(W, H) / 70;
  let s = '<rect x="0" y="0" width="' + W + '" height="' + H + '" fill="' + setup.bg + '" stroke="rgba(255,255,255,.3)" stroke-width="' + (r / 4) + '"/>';
  for (const pid of platesOf(setup)) {
    const cs = cornersOf(setup, pid).map(p => ({ x: p.x * W, y: p.y * H }));
    const act = pid === c.plate;
    s += '<polygon points="' + cs.map(p => p.x + ',' + p.y).join(' ') + '" fill="' + (act ? 'rgba(10,132,255,.18)' : 'rgba(255,255,255,.06)') + '" stroke="' + (act ? '#0a84ff' : 'rgba(255,255,255,.5)') + '" stroke-width="' + (r / 3) + '"/>';
    const cx = cs.reduce((a, p) => a + p.x, 0) / 4, cy = cs.reduce((a, p) => a + p.y, 0) / 4;
    s += '<text x="' + cx + '" y="' + cy + '" fill="#fff" font-size="' + (r * 2.2) + '" text-anchor="middle" dominant-baseline="middle" font-weight="600" pointer-events="none">' + (pid === 'L' ? 'Links' : 'Rechts') + '</text>';
    cs.forEach((p, i) => {
      const on = act && (c.corner === i || c.corner === 4);
      s += '<circle data-mc="' + pid + ',' + i + '" cx="' + p.x + '" cy="' + p.y + '" r="' + (r * 1.4) + '" fill="' + (on ? '#ff9f0a' : '#fff') + '" stroke="#000" stroke-width="' + (r / 4) + '" style="cursor:grab"/>';
    });
  }
  svg.innerHTML = s;
}
function bindMini() {
  document.addEventListener('pointerdown', e => {
    const t = e.target.closest && e.target.closest('[data-mc]'); if (!t) return;
    const svg = $('#mini'); if (!svg) return;
    e.preventDefault();
    const [pid, idx] = t.dataset.mc.split(','); const i = +idx;
    S.calib.plate = pid; S.calib.corner = i;
    const cs = materialize(pid);
    const toSvg = ev => { const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY; const m = svg.getScreenCTM(); return m ? pt.matrixTransform(m.inverse()) : { x: 0, y: 0 }; };
    const bs = S.beamerSize;
    const move = ev => {
      const p = toSvg(ev);
      cs[i].x = clamp(p.x / bs.w, -0.2, 1.2); cs[i].y = clamp(p.y / bs.h, -0.2, 1.2);
      drawMini(); syncLive();
    };
    const up = () => { window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); saveSetup(); syncLive(true); renderCalib(); };
    window.addEventListener('pointermove', move); window.addEventListener('pointerup', up);
    drawMini(); syncLive(true);
  });
}

/* ---------- Zeichenfläche: Ziehen & Skalieren ---------- */
function bindCanvas() {
  const wrap = $('#plateWrap');
  wrap.addEventListener('pointerdown', e => {
    const svg = wrap.querySelector('svg'); if (!svg) return;
    const t = e.target.closest('[data-k]');
    if (!t) {
      if (!S.multi && S.sel.length) { S.sel = []; renderAll(); }
      return;
    }
    e.preventDefault();
    const K = S.K, rect = svg.getBoundingClientRect();
    const toCm = ev => ({ x: (ev.clientX - rect.left) / K, y: (ev.clientY - rect.top) / K });
    const p0 = toCm(e), pl = P();
    const kind = t.dataset.k, id = +t.dataset.id;
    let mode = 'move', handle = null, orig = null, movedAny = false, lpTimer = null, lpDone = false;

    if (kind === 'h') {
      mode = 'resize'; handle = t.dataset.h;
      const o = pl.shapes.find(s => s.id === id); if (!o) return;
      orig = clone(o);
    } else {
      const key = (kind === 'l' ? 'l' : 's') + id;
      const prev = S.sel.slice();
      if (S.multi || e.shiftKey) {
        const i = S.sel.indexOf(key);
        if (i >= 0) { S.sel.splice(i, 1); renderAll(); return; }
        S.sel.push(key);
      } else if (!S.sel.includes(key)) S.sel = [key];
      renderAll();
      orig = selObjs().map(s => ({ k: s.k, o: s.o, x: s.o.x, y: s.o.y, pos: s.o.pos }));
      lpTimer = setTimeout(() => {
        if (movedAny) return;
        lpDone = true;
        S.sel = prev.includes(key) ? prev.filter(k => k !== key) : prev.concat(key);
        renderAll();
        if (navigator.vibrate) navigator.vibrate(12);
        toast(S.sel.length > 1 ? S.sel.length + ' Objekte ausgewählt' : S.sel.length ? 'Einzelauswahl' : 'Auswahl aufgehoben');
      }, 550);
    }
    const snap = v => S.view.snap ? Math.round(v * 2) / 2 : r2(v);

    const onMove = ev => {
      const p = toCm(ev), dx = p.x - p0.x, dy = p.y - p0.y;
      if (lpDone) return;
      if (!movedAny && Math.hypot(dx, dy) * K < 4) return;
      movedAny = true; clearTimeout(lpTimer);
      if (mode === 'resize') {
        const o = pl.shapes.find(s => s.id === id); if (!o) return;
        const th = (orig.rot || 0) * Math.PI / 180, c = Math.cos(th), s = Math.sin(th);
        const lx = dx * c + dy * s, ly = -dx * s + dy * c;
        const sx = handle.includes('e') ? 1 : -1, sy = handle.includes('s') ? 1 : -1;
        let nw = orig.w + sx * lx, nh = orig.h + sy * ly;
        if (o.lockRatio) { const r = orig.h / orig.w; if (Math.abs(nw - orig.w) * r >= Math.abs(nh - orig.h)) nh = nw * r; else nw = nh / r; }
        nw = Math.max(0.3, r1(nw)); nh = Math.max(0.3, r1(nh));
        const cxl = sx * (nw - orig.w) / 2, cyl = sy * (nh - orig.h) / 2;
        o.w = nw; o.h = nh;
        o.x = r2(orig.x + cxl * c - cyl * s); o.y = r2(orig.y + cxl * s + cyl * c);
        o.radius = Math.min(o.radius || 0, o.w / 2, o.h / 2);
      } else {
        const moved = new Set(), d = dims();
        for (const it of orig) {
          if (it.k === 's') { if (it.o.locked) continue; it.o.x = snap(it.x + dx); it.o.y = snap(it.y + dy); }
          else {
            if (lineLocked(it.o) || moved.has(it.o.id)) continue;
            const max = it.o.type === 'h' ? d.h : d.w;
            const target = clamp(snap(it.pos + (it.o.type === 'h' ? dy : dx)), 0, max);
            moveLine(it.o, target - it.o.pos, moved);
          }
        }
      }
      renderCanvas(); updateReadouts(); syncLive();
    };
    const onUp = () => {
      clearTimeout(lpTimer);
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
      window.removeEventListener('pointercancel', onUp);
      if (movedAny) {
        commit(); renderSide(); renderCanvas(); renderInsp();
        if (orig && orig.length && orig.every(it => it.k === 's' ? it.o.locked : lineLocked(it.o))) toast('Gesperrt – erst entsperren');
      }
    };
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onUp);
  });
}

/* ---------- Eingaben ---------- */
function propInput(el, final) {
  const s = one(); if (!s) return;
  const o = s.o, k = el.dataset.p;
  if (k === 'name' || k === 'info') { o[k] = el.value; renderCanvas(); if (final) { commit(); renderSide(); } else syncLive(); return; }
  if (k === 'color') { o.color = el.value; renderCanvas(); if (final) { commit(); renderSide(); renderInsp(); } else syncLive(); return; }
  const v = parseFloat(el.value); if (isNaN(v)) return;
  if (o.locked && k !== 'stroke') { if (final) { toast('Gesperrt – erst entsperren'); renderInsp(); } return; }
  if (s.k === 's') setShapeProp(o, k, v);
  else if (k === 'pos') moveLine(o, v - o.pos);
  else if (k === 'stroke') o.stroke = clamp(Math.round(v), 1, 20);
  renderCanvas(); updateReadouts(el);
  if (final) { commit(); renderSide(); updateReadouts(); } else syncLive();
}
function setInput(el, final) {
  const path = el.dataset.set; let v;
  if (el.type === 'checkbox') v = el.checked;
  else if (el.type === 'number') { v = parseFloat(el.value); if (isNaN(v)) return; }
  else if (el.tagName === 'SELECT' && /^-?\d+(\.\d+)?$/.test(el.value) && path !== 'startTemplate') v = +el.value;
  else v = el.value;
  setDeep(setup, path, v);
  if (path.indexOf('plates.') === 0 || path === 'gap') { normalizePlates(); if(/offset/.test(path)) setup.plates[S.plate].corners=null; }
  if (path === 'twoPlates' && !v && S.plate === 'R') { S.plate = 'L'; S.sel = []; }
  if (path === 'twoPlates' && !v) S.calib.plate = 'L';
  saveSetup();
  if ($('#calib').classList.contains('open')) { syncLive(); if (final && (path === 'twoPlates' || path.indexOf('area') === 0)) renderCalib(); }
  renderCanvas();
  if (final) {
    if (path.indexOf('ruler.lines') === 0 && /\.o$/.test(path)) { const i = +path.split('.')[2]; const L = setup.ruler.lines[i]; L.ref = L.o === 'h' ? 'top' : 'left'; saveSetup(); renderSettings(); }
    if (path === 'twoPlates' || path.indexOf('plates.') === 0) renderTop();
    if (path === 'bg' && $('#settings').classList.contains('open')) renderSettings();
  }
}
function infoInput(el, final) {
  const k = el.dataset.info, inf = P().info;
  if (k === 'notes') { P().notes = el.value; if (final) commit(); return; }
  if (k === 'size') { inf.size = +el.value; const ro = document.querySelector('[data-ro="infoSize"]'); if (ro) ro.textContent = inf.size; }
  else inf[k] = el.value;
  renderCanvas();
  if (final) commit(); else syncLive();
}

function readImage(file) {
  if (!file) return;
  const rd = new FileReader();
  rd.onload = () => {
    const img = new Image();
    img.onload = () => {
      const maxPx = 1400;
      let w = img.naturalWidth || 800, h = img.naturalHeight || 800;
      const f = Math.min(1, maxPx / Math.max(w, h));
      w = Math.round(w * f); h = Math.round(h * f);
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      let url;
      try { url = cv.toDataURL('image/png'); if (url.length > 1500000) url = cv.toDataURL('image/webp', 0.9); } catch (e) { url = rd.result; }
      addImage(url, h / w, file.name);
    };
    img.onerror = () => toast('Bild konnte nicht gelesen werden');
    img.src = rd.result;
  };
  rd.readAsDataURL(file);
}

function bindGlobal() {
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (!(b && b.dataset.act === 'pop')) document.querySelectorAll('.pop.open').forEach(p => { if (!p.contains(e.target)) p.classList.remove('open'); });
    if (!b) return;
    const fn = ACT[b.dataset.act];
    if (fn) fn(b.dataset.arg, b, e);
    if (b.closest('#morePop,#addPop')) closePops();
  });
  document.addEventListener('input', e => {
    const el = e.target;
    if (el.dataset.p) propInput(el, false);
    else if (el.dataset.set) setInput(el, false);
    else if (el.dataset.info) infoInput(el, false);
    else if (el.dataset.cal) { S.calib[el.dataset.cal] = +el.value || 10; syncLive(); }
  });
  document.addEventListener('change', e => {
    const el = e.target;
    if(el.matches('[data-obj-showinfo]')){const s=one();if(s&&s.k==='s'){s.o.showInfo=el.checked;commit();renderCanvas();}return;}
    if (el.dataset.p) propInput(el, true);
    else if (el.dataset.set) setInput(el, true);
    else if (el.dataset.info) infoInput(el, true);
  });
  document.addEventListener('toggle', e => { const d = e.target; if (d && d.dataset && d.dataset.grp) S.open[d.dataset.grp] = d.open; }, true);
  $('#fImg').addEventListener('change', e => { readImage(e.target.files[0]); e.target.value = ''; });
  $('#fProj').addEventListener('change', e => {
    const f=e.target.files[0]; if(!f)return;
    const rd=new FileReader();
    rd.onload=()=>{
      try{
        const d=JSON.parse(rd.result); if(!d.layout)throw 0;
        S.layout=normLayout(d.layout); S.sel=[];
        if(d.plates){for(const p of ['L','R'])if(d.plates[p]){setup.plates[p].w=+d.plates[p].w||setup.plates[p].w;setup.plates[p].h=+d.plates[p].h||setup.plates[p].h;setup.plates[p].corners=null;}}
        if(d.templateSetup) setup=deepMerge(setup,d.templateSetup);
        normalizePlates(); saveSetup(); commit(); renderAll(); toast((d.format==='EPST'?'EPST-Template':'Projekt')+' geladen');
      }catch(err){toast('Keine gültige EPST-/Projektdatei');}
    };
    rd.readAsText(f); e.target.value='';
  });
  $('#fSetup').addEventListener('change', e => {
    const f = e.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try { const d = JSON.parse(rd.result); if (!d.setup) throw 0; setup = deepMerge(DEFAULT_SETUP, d.setup); saveSetup(); renderSettings(); renderAll(); toast('Einstellungen importiert'); }
      catch (err) { toast('Datei enthält keine EPS-Einstellungen'); }
    };
    rd.readAsText(f); e.target.value = '';
  });
  document.addEventListener('keydown', e => {
    const tag = (e.target.tagName || '').toUpperCase();
    const typing = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
    if ((e.ctrlKey || e.metaKey) && !typing) {
      const k = e.key.toLowerCase();
      if (k === 'z' && !e.shiftKey) { e.preventDefault(); ACT.undo(); return; }
      if (k === 'y' || (k === 'z' && e.shiftKey)) { e.preventDefault(); ACT.redo(); return; }
      if (k === 'd') { e.preventDefault(); ACT.dup(); return; }
    }
    if (e.target.id === 'tplName' && e.key === 'Enter') { e.preventDefault(); ACT.tplSave(); return; }
    if (typing) return;
    if (e.key.toLowerCase() === 'i') { e.preventDefault(); ACT.view('infoDims'); return; }
    if (e.key === 'Escape') { if ($('#calib').classList.contains('open')) ACT.closeCalib(); else if ($('#settings').classList.contains('open')) ACT.closeSettings(); else ACT.deselect(); return; }
    if ((e.key === 'Delete' || e.key === 'Backspace') && S.sel.length) { e.preventDefault(); ACT.del(); return; }
    const m = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
    if (m && S.sel.length && !$('#calib').classList.contains('open')) { e.preventDefault(); const st = e.shiftKey ? 1 : 0.1; moveSel(m[0] * st, m[1] * st); }
  });
  let rt = null;
  window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(renderCanvas, 80); });
}

function initEditor() {
  setup = deepMerge(DEFAULT_SETUP, LS.get('eps5-setup', {}));
  normalizePlates();
  const view = deepMerge(DEFAULT_VIEW, LS.get('eps5-view', {}));
  const tpls = LS.get('eps5-templates', {}), st = setup.startTemplate;
  let layout;
  if (st === '__blank') layout = defaultLayout();
  else if (st && tpls[st]) layout = tpls[st];
  else layout = LS.get('eps5-layout', null);
  S = {
    layout: normLayout(layout), view, plate: 'L', sel: [], tab: 'obj', step: 0.5, rotStep: 1, zoom: 1, K: 10,
    multi: false, open: {}, history: [], hi: -1, warned: false,
    calib: { active: false, step: 1, plate: 'L', corner: 0, nudge: 5, roughStep: 0.5, sq: 10 },
    beamerSize: LS.get('eps5-beamer-size', { w: 1920, h: 1080 })
  };
  try { bc = new BroadcastChannel('eps5'); } catch (e) { bc = null; }
  if (bc) bc.onmessage = e => {
    const m = e.data || {};
    if (m.type === 'size') { S.beamerSize = { w: m.w, h: m.h }; if ($('#calib').classList.contains('open')) renderCalib(); }
    if (m.type === 'hello') syncLive(true);
  };
  window.addEventListener('storage', e => {
    if (e.key === 'eps5-beamer-size') { S.beamerSize = LS.get('eps5-beamer-size', S.beamerSize); if ($('#calib').classList.contains('open')) renderCalib(); }
  });
  renderRail();
  bindGlobal(); bindCanvas(); bindMini();
  commit();
  renderAll();
  requestAnimationFrame(renderCanvas);
}

initEditor();
})();
</script>
